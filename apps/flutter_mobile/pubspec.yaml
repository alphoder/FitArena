name: fitarena
description: "FitArena - Turn Every Workout Into a Territory Battle"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # HTTP & networking
  dio: ^5.7.0

  # Storage
  flutter_secure_storage: ^9.2.4

  # Firebase (add back when configuring push notifications)
  # firebase_core: ^3.12.1
  # firebase_messaging: ^15.2.4

  # UI utilities
  cupertino_icons: ^1.0.8
  fl_chart: ^0.70.2
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.16

  # Maps (free, no API key needed)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Platform utilities
  url_launcher: ^6.3.2
  share_plus: ^10.1.4
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
